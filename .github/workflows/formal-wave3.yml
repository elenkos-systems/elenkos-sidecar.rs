name: Formal wave 3
on:
  pull_request:
    paths: ['conformance/**', 'Cargo.toml', '.github/workflows/formal-wave3.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  bounded-model-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@4305c38b25d97ef35a8ad1f985ccf2d2242004f2
        with:
          toolchain: '1.90.0'
      # This isolated model uses only std; avoid unrelated private Cargo edges.
      # Full sidecar build/integration evidence is a separate release gate.
      - name: Compile and test isolated Rust capability model
        shell: bash
        run: |
          set -euo pipefail
          rustc +1.90.0 --edition=2021 --test conformance/admin_capability_model.rs -o "$RUNNER_TEMP/capability-tests"
          "$RUNNER_TEMP/capability-tests"
          rustc +1.90.0 --edition=2021 conformance/admin_capability_model.rs -o "$RUNNER_TEMP/capability-model"
          "$RUNNER_TEMP/capability-model"
      - name: Exhaust equivalent Python capability model
        run: python3 conformance/admin_capability_model.py
